name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Cache Android build folders
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/build
            android/app/build
            android/app/.cxx
          key: ${{ runner.os }}-android-build-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Expo Prebuild
        run: bunx expo prebuild --platform android --no-install

      - name: Configure Android Project for CI Build
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          sed -i 's/signingConfig null/signingConfig signingConfigs.debug/g' android/app/build.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC" >> android/gradle.properties
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > android/app/debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: purl-release-debug-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
